name: npm

# Publishes a release to npm (#1084), so `npx cfgaudit@X.Y.Z` works and a
# JavaScript project can pin cfgaudit in devDependencies. One package per
# platform (@cfgaudit/<os>-<cpu>) carries the binary of the GitHub release, not
# a rebuild: the archives are checked against checksums.txt and the provenance
# of build-release.yml before they are packed. The main package cfgaudit lists
# them as optionalDependencies and runs the matching one; it has no install
# script. Runs after a successful Release workflow, like pypi.yml. Run it by
# hand to publish an existing tag, or with publish off as a dry run. Pull
# requests that change the packaging build and smoke-test the packages of the
# latest release without publishing. Upload is via npm trusted publishing from
# the `npm` environment, which needs the maintainer's approval; no token is
# stored.

on:
  # Release runs only for tag pushes. This workflow checks out the default
  # branch, takes nothing from the triggering run but its tag name (checked
  # below), and verifies the release archives before using them.
  workflow_run: # zizmor: ignore[dangerous-triggers] see above
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.19.0
        required: true
      publish:
        description: Upload to npm (off for a dry run that only builds and smoke-tests)
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/npm.yml
      - .github/scripts/build-npm.py
      - .github/scripts/smoke-test.sh

# Default-deny; each job grants only what it needs.
permissions: {}

concurrency:
  group: npm
  cancel-in-progress: false

jobs:
  build:
    name: Build the packages
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read # download the release assets
      attestations: read # verify their provenance
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          # tmaproduction.blob.core.windows.net: gh attestation verify fetches
          # the attestation bundles from there.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443

      # The script comes from the default branch, not from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${INPUT_TAG:-$RUN_TAG}"
          if [ "$EVENT" = pull_request ]; then
            tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download and verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --repo "$REPO" --dir dist \
            --pattern checksums.txt --pattern '*.tar.gz' --pattern '*.zip'
          cd dist
          # checksums.txt also lists the SBOMs, which aren't needed here;
          # build-npm.py fails if one of the six archives is missing.
          sha256sum --check --strict --ignore-missing checksums.txt
          for f in checksums.txt *.tar.gz *.zip; do
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/build-release.yml" \
              --source-ref "refs/tags/$TAG"
          done

      - name: Build the packages
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python3 -I .github/scripts/build-npm.py "$VERSION" dist packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: packages/*.tgz
          if-no-files-found: error

  # Each package is installed from the tarballs into an empty project on its
  # platform, the way `npm install cfgaudit` resolves it, and run through the
  # launcher. The platform package is passed explicitly and the install runs
  # offline, so the test does not depend on what is on the registry.
  smoke:
    name: Smoke-test on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, pkg: linux-x64 }
          - { os: ubuntu-24.04-arm, pkg: linux-arm64 }
          - { os: macos-latest, pkg: darwin-arm64 }
          - { os: windows-latest, pkg: win32-x64 }
          - { os: windows-11-arm, pkg: win32-arm64 }
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install from the tarballs and run
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PKG: ${{ matrix.pkg }}
        run: | # zizmor: ignore[adhoc-packages] the two local tarballs from the build job, installed offline
          set -euo pipefail
          proj=$(mktemp -d)
          (cd "$proj" && npm init -y > /dev/null)
          # Only the two tarballs the build job made, offline and with an empty
          # cache, so nothing comes from the registry.
          npm install --prefix "$proj" --offline --cache "$RUNNER_TEMP/npm-cache" --ignore-scripts --no-audit --no-fund \
            "$PWD/packages/cfgaudit-$VERSION.tgz" "$PWD/packages/cfgaudit-$PKG-$VERSION.tgz"
          .github/scripts/smoke-test.sh "$VERSION" "$proj/node_modules/.bin/cfgaudit"
          (cd "$proj" && npx --no-install cfgaudit --version)

  publish:
    name: Publish to npm
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/cfgaudit/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write # trusted publishing and npm provenance
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          # registry.npmjs.org: publish, the skip-existing check and the OIDC
          # token exchange of trusted publishing; sigstore: npm provenance;
          # the release assets and nodejs.org: setup-node, when the runner
          # has no cached Node 24.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            *.actions.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packages

      # Node 24 ships npm 11, which publishes through trusted publishing (OIDC)
      # without a token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # The platform packages first, so the main package never points at a
      # version that is not there. A package already published at this version
      # is skipped, so a rerun after a partial upload finishes the rest.
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          npm --version
          for tgz in packages/cfgaudit-*-"$VERSION".tgz packages/cfgaudit-"$VERSION".tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published, skipping"
              continue
            fi
            npm publish --provenance --access public "$tgz"
          done

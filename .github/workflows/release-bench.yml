# Measures how long every release takes to scan one generated input (#1619)
# and appends one record per release to releases.jsonl on the bench-data
# branch, which the website charts (cfgaudit/cfgaudit.github.io#46). Every run
# measures all releases in one job, taking turns, so the records of one run
# compare with each other; the website draws only the latest run.
#
# Two jobs, as in bench-history.yml: measure downloads and runs the release
# binaries with a read-only token and uploads the records; record only checks
# those records and pushes them.
name: Release scan time

on:
  workflow_dispatch:
  # Release runs only for tag pushes. This workflow checks out the default
  # branch, takes nothing from the triggering run but its conclusion, and
  # checks every archive against its checksums.txt before running it.
  workflow_run: # zizmor: ignore[dangerous-triggers] see above
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-bench
  cancel-in-progress: false

jobs:
  measure:
    name: Measure
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release tags and their commit dates
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Write the input
        run: CFGAUDIT_BENCH_INPUT="$RUNNER_TEMP/input" go test -run '^TestWriteReleaseBenchInput$' -count 1 ./internal/benchcorpus
      # Each release's linux_amd64 binary, checked against its checksums.txt.
      # A release without the archive (v0.1.0) or with a bad hash is skipped.
      - name: Download the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 500 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V > "$RUNNER_TEMP/tags"
          : > "$RUNNER_TEMP/releases.tsv"
          while read -r tag; do
            version=${tag#v}
            archive="cfgaudit_${version}_linux_amd64.tar.gz"
            dir="$RUNNER_TEMP/releases/$tag"
            mkdir -p "$dir"
            if ! gh release download "$tag" -p "$archive" -p checksums.txt -D "$dir" 2> /dev/null; then
              echo "::warning::$tag: no $archive; skipped"
              continue
            fi
            if ! (cd "$dir" && grep -E "^[0-9a-f]{64}  ${archive//./\\.}\$" checksums.txt | sha256sum -c --quiet -); then
              echo "::warning::$tag: checksum mismatch; skipped"
              continue
            fi
            tar -xzf "$dir/$archive" -C "$dir" cfgaudit
            printf '%s\t%s\t%s\t%s\n' "$tag" "$dir/cfgaudit" "$(git rev-list -n 1 "$tag")" "$(git log -1 --format=%cI "$tag")" >> "$RUNNER_TEMP/releases.tsv"
          done < "$RUNNER_TEMP/tags"
      # Run from an empty directory, so no .cfgaudit.yml of this checkout applies.
      - name: Measure
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cwd"
          cd "$RUNNER_TEMP/cwd"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/release-bench.py" \
            "$RUNNER_TEMP/releases.tsv" "$RUNNER_TEMP/input" "$RUNNER_TEMP/records.jsonl" "$RUN_ID" "$(go env GOVERSION)"
          cat "$RUNNER_TEMP/records.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-records
          path: ${{ runner.temp }}/records.jsonl
          retention-days: 7

  record:
    name: Record
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-records
          path: ${{ runner.temp }}/records
      # The records are data from the read-only job; check their shape before
      # they are committed anywhere.
      - name: Check the records
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          records="$RUNNER_TEMP/records/records.jsonl"
          [[ -s $records ]]
          jq -s -e --argjson run "$RUN_ID" 'all(
            .schema == 1 and .kind == "release" and .run == $run
            and (.tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            and (.commit | test("^[0-9a-f]{40}$"))
            and (.median_ms | type == "number" and . > 0)
            and (.runs_ms | type == "array" and length > 0 and all(type == "number"))
            and (.rules == null or (.rules | type == "number")))' "$records" > /dev/null
      - name: Append to bench-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q data && cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth 1 "$remote" bench-data
          git checkout -q -b bench-data FETCH_HEAD
          cat "$RUNNER_TEMP/records/records.jsonl" >> releases.jsonl
          if ! grep -q 'releases.jsonl' README.md; then
            cat >> README.md <<'EOF'

          `releases.jsonl` holds the scan time of every release, written by `.github/workflows/release-bench.yml` after each release and on request (#1619). Each run measures all releases in one job, taking turns, on the same generated input, so only records with the same `run` compare with each other. One JSON object per release and run:

          | Field | Meaning |
          |---|---|
          | `schema` | format version, `1` |
          | `kind` | `release` |
          | `tag`, `commit`, `date` | the release, its commit and commit date |
          | `rules` | number of rules (`cfgaudit list --format json`), `null` where the release lacks it |
          | `input`, `input_sha256` | the generated input (`benchcorpus.Large`) and a hash of its files |
          | `run` | the workflow run id |
          | `median_ms`, `runs_ms` | wall time of `cfgaudit <input>`: the median and every timed run, after one warm-up scan |
          | `cpu`, `go` | runner CPU model and the Go version of the measuring job |
          EOF
            git add README.md
          fi
          git add releases.jsonl
          git commit -q -m "release-bench: run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git push -q "$remote" HEAD:bench-data && exit 0
            sleep $((attempt * 5))
            git pull -q --rebase "$remote" bench-data
          done
          exit 1

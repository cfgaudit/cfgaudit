# Runs the benchmarks on the PR's base commit and on the PR, compares them
# with benchstat on the run's summary page, and fails when a benchmark
# allocates more than ALLOCS_LIMIT percent more than on the base (#1016).
# Time is reported but not gated: hosted runners vary too much from run to
# run for a time threshold to mean anything yet.
name: Benchmarks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: head/go.mod
          cache-dependency-path: head/go.sum
      # Built from .github/tools/benchstat, whose go.sum pins the version.
      - name: Build benchstat
        working-directory: head/.github/tools/benchstat
        run: go build -o "$RUNNER_TEMP/benchstat" golang.org/x/perf/cmd/benchstat
      # Base and head take turns, so a runner that slows down part way through
      # affects both sides alike. -benchtime 10x keeps the job to a few minutes.
      - name: Run benchmarks
        run: |
          set -euo pipefail
          pkgs="./rules ./cmd/cfgaudit"
          has_base=0
          [[ -f base/cmd/cfgaudit/bench_test.go ]] && has_base=1
          for _ in 1 2 3 4 5; do
            if [[ $has_base == 1 ]]; then
              (cd base && go test -run '^$' -bench . -benchmem -benchtime 10x -count 2 $pkgs) >> "$RUNNER_TEMP/base.txt"
            fi
            (cd head && go test -run '^$' -bench . -benchmem -benchtime 10x -count 2 $pkgs) >> "$RUNNER_TEMP/head.txt"
          done
          echo "HAS_BASE=$has_base" >> "$GITHUB_ENV"
      - name: Compare
        env:
          ALLOCS_LIMIT: "20"
          ALLOCS_MIN_DELTA: "100"
          LC_ALL: C
        run: |
          set -euo pipefail
          cpu=$(grep -m1 '^cpu:' "$RUNNER_TEMP/head.txt" | cut -d' ' -f2-)
          {
            echo "## Benchmarks"
            echo
            echo "Runner CPU: ${cpu:-unknown}."
            echo 'Time varies between runners; `allocs/op` and `B/op` barely do. The job fails only on an allocation regression.'
            echo
            echo '```'
            if [[ $HAS_BASE == 1 ]]; then
              "$RUNNER_TEMP/benchstat" base="$RUNNER_TEMP/base.txt" head="$RUNNER_TEMP/head.txt"
            else
              echo "The base commit has no benchmarks; showing this PR only."
              "$RUNNER_TEMP/benchstat" "$RUNNER_TEMP/head.txt"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ $HAS_BASE == 1 ]] || exit 0
          # Median allocs/op (and init-allocs/op) per benchmark on each side,
          # then the regressions. A benchmark that allocates little moves by a
          # few dozen allocations from run to run (the regexp machine pool is
          # emptied by GC), so a regression must also exceed ALLOCS_MIN_DELTA.
          median() {
            awk '/^Benchmark/ { for (i = 3; i < NF; i++) if ($(i + 1) ~ /^(init-)?allocs\/op$/) print $1 ":" $(i + 1), $i }' "$1" |
              sort -k1,1 -k2,2n |
              awk '{ v[$1] = v[$1] " " $2; n[$1]++ }
                   END { for (b in v) { split(substr(v[b], 2), a, " "); print b, a[int((n[b] + 1) / 2)] } }' |
              sort
          }
          join <(median "$RUNNER_TEMP/base.txt") <(median "$RUNNER_TEMP/head.txt") |
            awk -v limit="$ALLOCS_LIMIT" -v min="$ALLOCS_MIN_DELTA" '$2 > 0 && $3 - $2 > min && ($3 - $2) * 100 / $2 > limit {
                   printf "::error::%s is %.1f%% above the base (%d -> %d, limit %s%%)\n",
                     $1, ($3 - $2) * 100 / $2, $2, $3, limit; bad = 1 }
                 END { exit bad }'

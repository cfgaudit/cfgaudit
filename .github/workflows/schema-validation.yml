name: Schema validation

on:
  push:
    branches: [main]
    paths:
      - 'testdata/settings/**'
      - 'testdata/schemas/**'
      - 'cmd/cfgaudit/testdata/reports/**'
      - '.github/workflows/schema-validation.yml'
      - '.github/tools/ajv/**'
      - 'schema/**'
      - 'testdata/config/**'
  pull_request:
    branches: [main]
    paths:
      - 'testdata/settings/**'
      - 'testdata/schemas/**'
      - 'cmd/cfgaudit/testdata/reports/**'
      - '.github/workflows/schema-validation.yml'
      - '.github/tools/ajv/**'
      - 'schema/**'
      - 'testdata/config/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate fixtures against SchemaStore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ajv
        # From .github/tools/ajv's lockfile with npm ci (#677): versions and
        # integrity hashes are fixed and Dependabot updates them. Install
        # scripts are skipped; ajv needs none. The validation runs through
        # .github/tools/ajv/validate.js, not ajv-cli: ajv-cli's own
        # dependencies carry advisories no release of it fixes (#701).
        run: npm ci --prefix .github/tools/ajv --ignore-scripts --no-audit --no-fund

      - name: Fetch Claude Code settings schema
        run: |
          curl -sSfL https://json.schemastore.org/claude-code-settings.json \
            -o /tmp/claude-code-settings.schema.json

      - name: Validate valid fixtures
        run: |
          set -e
          node .github/tools/ajv/validate.js /tmp/claude-code-settings.schema.json \
            testdata/settings/valid/*.json

      - name: Check invalid fixtures are structurally parseable
        run: |
          set -e
          for f in testdata/settings/invalid/*.json; do
            echo "Checking $f is valid JSON"
            jq empty "$f"
          done

      - name: Open issue on nightly schema drift
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Nightly schema validation failed"
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Nightly run failed again: $RUN_URL"
          else
            body=$(cat <<EOF
          The nightly schema validation against [SchemaStore](https://json.schemastore.org/claude-code-settings.json) failed. The upstream Claude Code settings schema may have changed.

          Run: $RUN_URL

          Next steps:
          1. Diff the upstream schema for added/renamed/removed keys.
          2. Update affected fixtures under \`testdata/settings/\`.
          3. Update rules that reference removed keys.
          4. Close this issue.
          EOF
          )
            gh issue create --title "$TITLE" --label "ci" --body "$body"
          fi

  # The golden reports in cmd/cfgaudit/testdata/reports are what the encoders
  # produce (TestReportGoldens fails otherwise), so validating them checks that
  # GitHub code scanning and GitLab Code Quality accept cfgaudit's output
  # (#1063). The SARIF 2.1.0 schema is the one the reports name in $schema,
  # fetched from SchemaStore and pinned by hash (it is not vendored: it is
  # OASIS material without an SPDX license). GitLab publishes no Code Quality
  # schema, so testdata/schemas/gitlab-code-quality.json is written from the
  # fields its docs require.
  reports:
    name: Validate reports against their schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ajv
        run: npm ci --prefix .github/tools/ajv --ignore-scripts --no-audit --no-fund

      - name: SARIF
        env:
          # sha256 of https://json.schemastore.org/sarif-2.1.0.json, checked 2026-10-30.
          # A mismatch means upstream changed the schema: review the diff, then
          # update the hash.
          SARIF_SCHEMA_SHA256: c96eb2d311c37b0a38cbd18c52d79a68f778bbd2d831abed7412d9850740f785
        run: |
          curl -sSfL https://json.schemastore.org/sarif-2.1.0.json -o "$RUNNER_TEMP/sarif-2.1.0.json"
          echo "$SARIF_SCHEMA_SHA256  $RUNNER_TEMP/sarif-2.1.0.json" | sha256sum -c -
          node .github/tools/ajv/validate.js "$RUNNER_TEMP/sarif-2.1.0.json" cmd/cfgaudit/testdata/reports/sarif.golden.json

      - name: GitLab Code Quality
        run: node .github/tools/ajv/validate.js testdata/schemas/gitlab-code-quality.json cmd/cfgaudit/testdata/reports/codeclimate.golden.json

  # schema/cfgaudit.schema.json is the published schema for .cfgaudit.yml
  # (#1106). testdata/config/json holds the JSON form of every example the
  # parser accepts (the annotated examples in the docs and
  # testdata/config/valid) and of every one it rejects (testdata/config/invalid),
  # kept current by TestSchema_Examples. The schema must accept the first and
  # reject the second, so an editor shows the errors cfgaudit exits 2 on.
  # Compiling the schema also checks it against the draft-07 meta-schema.
  config-schema:
    name: Validate the .cfgaudit.yml schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ajv
        run: npm ci --prefix .github/tools/ajv --ignore-scripts --no-audit --no-fund

      - name: Accepted examples
        run: node .github/tools/ajv/validate.js schema/cfgaudit.schema.json testdata/config/json/valid/*.json

      - name: Rejected examples
        run: node .github/tools/ajv/validate.js --invalid schema/cfgaudit.schema.json testdata/config/json/invalid/*.json

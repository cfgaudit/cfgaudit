name: Release

on:
  push:
    tags:
      # Full semver tags only (vX.Y.Z) — not the moving vN GitHub Action tag.
      - 'v*.*.*'

# Default-deny at the workflow level; each job grants only what it needs, so the
# gate never holds release or signing rights it has no use for.
permissions: {}

# One run per tag at a time. A single tag push has been delivered as several
# push events (v1.15.0 started four runs of each workflow in the same second),
# and parallel runs collide on the same release assets and image tags. Queued
# runs are not cancelled mid-publish; the gate below turns a queued duplicate
# into a no-op once an earlier run for the same commit has succeeded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can point at any commit — including one whose CI failed, or one that
  # never reached main and so was never tested at all. Require a green CI run for
  # this exact SHA before anything is published. Fails closed: no completed run
  # means no release.
  gate:
    name: Require green CI
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.dedupe.outputs.publish }}
    permissions:
      actions: read # read this repo's workflow-run history
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI conclusion for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Release blocked: CI for $SHA concluded '$conclusion', expected 'success'. If CI is still running for this commit, wait for it to finish and re-run this workflow; otherwise tag a commit whose CI passed on main."
            exit 1
          fi

      - name: Skip a duplicate run of this tag
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          done=$(gh api \
            "repos/$REPO/actions/workflows/release.yml/runs?head_sha=$SHA&event=push&status=success" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length")
          if [ "$done" -gt 0 ]; then
            echo "::notice::An earlier run of this workflow already published $SHA; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # The build, attestation and upload run in build-release.yml, so that file
  # signs the provenance (SLSA Build Level 3, #724). This job only calls it and
  # grants it the permissions it needs.
  goreleaser:
    name: GoReleaser
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    permissions:
      contents: write # create the GitHub release and upload archives/checksums
      id-token: write # keyless signing of the provenance via Sigstore
      attestations: write # write the attestation to the GitHub attestations API
    uses: $/.github/workflows/build-release.yml
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

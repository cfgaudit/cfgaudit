name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The ShellCheck that Lint and the CFG045 integration test install, and that
  # the Docker job expects in the image. The image takes it from Alpine, so an
  # Alpine bump can move it: update both values to match, after the 7-day
  # cooldown. The digest is the sha256 of the linux.x86_64.tar.xz release asset.
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Check the restored module cache against go.sum before compiling, so a
      # corrupted or tampered cache fails the build instead of building silently.
      - run: go mod verify
      # Fails when go.mod or go.sum don't match what the code imports, for the
      # main module and the pinned tool modules (#787, #1016).
      - run: go mod tidy -diff
      - run: go mod tidy -diff
        working-directory: .github/tools/gobco
      - run: go mod tidy -diff
        working-directory: .github/tools/benchstat
      - run: go mod tidy -diff
        working-directory: .github/tools/deadcode
      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request runs on its merge commit; the check of the changed
          # lines below compares it with its first parent, the base.
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      # -coverpkg=./... counts a statement as covered when any package's tests
      # run it, not only its own package's (#706). Parser code is mostly
      # exercised by the rule tests, which assert on the findings it feeds;
      # without the flag it reads as untested. -count=1 because a cached result
      # brings the line numbers of an older checkout into the profile (#1442).
      - run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      # Shows the total and per-package coverage on the run's summary page and
      # fails below COVERAGE_FLOOR (#674). Raise the floor in a PR when the
      # total has moved up; it was 96.5% when the floor was last set (#1442).
      - name: Coverage
        env:
          COVERAGE_FLOOR: "95.0"
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          {
            echo "## Coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            # Built from the profile, not from go test's output: with
            # -coverpkg each test binary reports its coverage of all packages.
            # Every test binary writes each block once; a block counts as
            # covered when any of them ran it.
            awk 'NR > 1 {
              if ($3 > 0) hit[$1] = 1
              stmts[$1] = $2
            }
            END {
              for (b in stmts) {
                pkg = b
                sub(/\/[^\/]*:.*$/, "", pkg)
                sub("^github.com/cfgaudit/cfgaudit/?", "", pkg)
                if (pkg == "") pkg = "(root)"
                total[pkg] += stmts[b]
                if (b in hit) covered[pkg] += stmts[b]
              }
              for (p in total) printf "| `%s` | %.1f%% |\n", p, 100 * covered[p] / total[p]
            }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t < f) }'; then
            echo "::error::Total coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          fi
          echo "Total coverage ${total}% (floor ${COVERAGE_FLOOR}%)"
      # A change cannot hide behind the total above: the lines it adds must be
      # covered themselves (#1442). Only .github/coverage-allow.txt excepts a
      # function. The thresholds are the defaults of cmd/coveragecheck.
      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          go run ./cmd/coveragecheck -profile coverage.out -base HEAD^1 \
            -allow .github/coverage-allow.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
      # The tests above use whatever ShellCheck the runner image has, and skip
      # the real binary when it has none. This step uses the pinned one, and the
      # variable turns every such skip into a failure (#1445). -run takes all of
      # CFG045, so renaming a test cannot leave it matching nothing.
      - name: Install ShellCheck
        run: .github/scripts/install-shellcheck.sh "$RUNNER_TEMP/shellcheck"
      - name: CFG045 against the pinned ShellCheck
        run: |
          PATH="$RUNNER_TEMP/shellcheck:$PATH" \
            CFGAUDIT_REQUIRE_SHELLCHECK="$SHELLCHECK_VERSION" \
            go test -count=1 -v -run '^TestCFG045' ./rules

  # Publishes main's coverage to Codecov for the README badge and the history
  # (#703). The floor in the Test job stays the gate: this job never runs on
  # pull requests, and a Codecov outage does not fail it.
  coverage-upload:
    name: Upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC upload, no stored Codecov token
    steps:
      # Codecov maps the module paths in coverage.out onto the repository's
      # files, so it needs the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  # Branch coverage measured with gobco (#756), the number the OpenSSF Best
  # Practices gold level asks for. gobco instruments one package at a time and
  # credits only that package's own tests, so it reads lower than the
  # statement coverage above. Fails below BRANCH_FLOOR.
  branch-coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      # Built from .github/tools/gobco, whose go.sum pins the version.
      - name: Build gobco
        working-directory: .github/tools/gobco
        run: go build -o "$RUNNER_TEMP/gobco" github.com/rillig/gobco
      - name: Branch coverage
        env:
          # The total was 90.4% when these were last set (#1442). The critical
          # packages have their own floors in the case below, so a drop there
          # cannot be hidden by the rest of the repository.
          BRANCH_FLOOR: "88.0"
        run: |
          set -euo pipefail
          # gobco copies each package to a temporary module that cannot resolve
          # the dependencies from the module cache; a vendor directory carries them.
          go mod vendor
          {
            echo "## Branch coverage (gobco)"
            echo
            echo "| Package | Covered | Branches | Coverage | Floor |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          covered=0 branches=0 below=""
          for pkg in $(go list -f '{{.Dir}}' ./... | sed "s|^$PWD|.|"); do
            # gobco sends the failures of go test to stdout, so keep them for the
            # job log instead of filtering them out.
            if ! "$RUNNER_TEMP/gobco" -branch "$pkg" > "$RUNNER_TEMP/gobco.log" 2>&1; then
              cat "$RUNNER_TEMP/gobco.log"
              exit 1
            fi
            line=$(grep '^Branch coverage: ' "$RUNNER_TEMP/gobco.log")
            c=${line#Branch coverage: }
            case "$pkg" in
              ./cmd/cfgaudit) floor=84.0 ;;
              ./internal/parser) floor=90.0 ;;
              ./internal/scanroot) floor=87.0 ;;
              ./rules) floor=90.0 ;;
              *) floor="" ;;
            esac
            percent=$(awk -v c="${c%/*}" -v b="${c#*/}" 'BEGIN { printf "%.1f", 100 * c / b }')
            mark=""
            if [ -n "$floor" ] && awk -v t="$percent" -v f="$floor" 'BEGIN { exit !(t < f) }'; then
              mark=" **below**"
              below="$below $pkg ($percent% < $floor%)"
            fi
            echo "| \`$pkg\` | ${c%/*} | ${c#*/} | ${percent}%${mark} | ${floor:+$floor%} |" >> "$GITHUB_STEP_SUMMARY"
            covered=$((covered + ${c%/*})) branches=$((branches + ${c#*/}))
          done
          total=$(awk -v c="$covered" -v b="$branches" 'BEGIN { printf "%.1f", 100 * c / b }')
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Total: ${covered}/${branches} = ${total}% (floor ${BRANCH_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v f="$BRANCH_FLOOR" 'BEGIN { exit !(t < f) }'; then
            echo "::error::Branch coverage ${total}% is below the floor of ${BRANCH_FLOOR}%"
            exit 1
          fi
          if [ -n "$below" ]; then
            echo "::error::Branch coverage below the package floor:$below"
            exit 1
          fi
          echo "Branch coverage ${covered}/${branches} = ${total}% (floor ${BRANCH_FLOOR}%)"

  # cfgaudit ships macOS and Windows binaries but the required Test job above runs
  # Linux only. This non-required leg exercises the OS-sensitive code (filepath /
  # glob discovery, case-sensitivity, line endings) on the other two platforms.
  # Kept separate rather than matrixing Test, so the branch-protection "Test"
  # required check keeps its name; Linux is already covered above.
  test-cross:
    name: Cross-platform tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    defaults:
      run:
        # The Windows runner defaults to PowerShell; force bash so the go
        # invocation is identical across platforms.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      # The race detector is not supported on windows/arm64, so that leg runs
      # the tests without it (#1126).
      - env:
          OS: ${{ matrix.os }}
        run: |
          if [ "$OS" = windows-11-arm ]; then
            go test ./...
          else
            go test -race ./...
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Installed from its release and checked against this digest, as pinact
      # is below; ShellCheck is pinned at the top of this file. Both run in this
      # job because Lint is a required check. The digest is the release asset's
      # sha256 for linux_amd64. Bump both values together, after the 7-day
      # cooldown.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: Install actionlint and ShellCheck
        run: |
          set -euo pipefail
          actionlint=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -sSfLo "$RUNNER_TEMP/$actionlint" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$actionlint"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$actionlint" | sha256sum -c -
          .github/scripts/install-shellcheck.sh "$RUNNER_TEMP/lint-tools"
          tar -xzf "$RUNNER_TEMP/$actionlint" -C "$RUNNER_TEMP/lint-tools" actionlint
          "$RUNNER_TEMP/lint-tools/actionlint" --version
      # The runner image ships its own ShellCheck; the prepended directory and
      # the -shellcheck flag make sure the pinned one runs. actionlint hands it
      # every bash run block in the workflows, which the script below cannot
      # reach (#1446).
      - name: Lint shell scripts
        run: PATH="$RUNNER_TEMP/lint-tools:$PATH" .github/scripts/lint-shell.sh
      # -ignore: actionlint 1.7.12 rejects `uses: $/`, the runner's reference to
      # the commit under test (#693). Drop it once a release accepts that form.
      # It is here on the command line, so it is reviewed like the workflow.
      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/lint-tools/actionlint" -pyflakes= \
            -shellcheck="$RUNNER_TEMP/lint-tools/shellcheck" \
            -ignore '(action|reusable workflow call) "\$/'

  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Built from .github/tools/deadcode, whose go.sum pins the version.
      - name: Build deadcode
        working-directory: .github/tools/deadcode
        run: go build -o "$RUNNER_TEMP/deadcode" golang.org/x/tools/cmd/deadcode
      # Exported functions nothing reachable from cmd/cfgaudit calls, outside
      # .github/deadcode-allow.txt, and stale entries there (#1099).
      - name: Check for unreachable functions
        run: .github/scripts/deadcode-check.sh "$RUNNER_TEMP/deadcode"

  pinact:
    name: Security (pinact)
    runs-on: ubuntu-latest
    env:
      # pinact is installed from its release and checked against this digest,
      # as lychee is in linkcheck.yml. A Go tool module would pull in Go 1.27
      # and an MPL-2.0 dependency the dependency review rejects. Bump both
      # together, after the 7-day cooldown.
      PINACT_VERSION: "5.0.1"
      PINACT_SHA256: 12500c0fff5db94a0155e2e76ed959d1dc0e899056ee168d8fb7b4840e7c04f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinact
        run: |
          set -euo pipefail
          archive=pinact_linux_amd64.tar.gz
          curl -sSfLo "$RUNNER_TEMP/$archive" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/$archive"
          echo "$PINACT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" pinact
          "$RUNNER_TEMP/pinact" --version
      # zizmor and cfgaudit require a SHA pin; this also checks that each
      # action's version comment resolves to the pinned SHA, so a pin cannot
      # claim a version it is not (#1127). --check reports and never rewrites.
      # The exclusions are here on the command line, not in a config a pull
      # request could edit, and zizmor and cfgaudit still enforce the pins:
      # - codeql-action's comment (# codeql-bundle-vX.Y.Z) is not a tag pinact
      #   can resolve;
      # - the aquasecurity organization has an IP allow list that refuses the
      #   API from GitHub's runners (403), so its tags cannot be resolved here.
      - name: Verify action pins and their version comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/pinact" run --check --verify-comment --exclude "github/codeql-action/.*" --exclude "aquasecurity/.*"'

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The action sets up Go again and defaults to the newest stable release;
      # take the version from go.mod instead, so govulncheck checks the standard
      # library the release is built with (#775).
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ""
          go-version-file: go.mod

  # Checks the dependencies a pull request adds or changes, in every manifest
  # the dependency graph reads (go.mod, the CI tool lock files, the workflows'
  # actions), against the GitHub Advisory Database and the license policy in
  # SECURITY.md (#737). govulncheck above covers reachable Go vulnerabilities;
  # this covers what a change brings in. Pull requests only: there is no diff
  # to review on a push.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # The golang.org/x modules are BSD-3-Clause plus Google's additional
          # patent grant (the PATENTS file), which ScanCode reports as its own
          # license ref. It grants rights and restricts nothing (#1099).
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, LicenseRef-scancode-google-patent-license-golang

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build and load (no push): validates the Dockerfile and that the build
      # context carries everything go:embed needs (e.g. docs/rules/*.md), and
      # produces a local image for Trivy to scan. The release image build runs on
      # tags in build-image.yml (called by docker.yml); this catches drift in PRs.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cfgaudit:ci
      # Scan the base image's OS packages for CVEs — the gap Dependabot's docker
      # ecosystem can only paper over with tag bumps. The Go binary's own vulns are
      # covered by govulncheck (reachability-aware), so scan OS packages only:
      # gating on all Go-stdlib CVEs would flake red whenever the pinned Go builder
      # trails the latest patch. ignore-unfixed skips CVEs with no available fix so
      # only an actionable base-image bump blocks the build.
      - name: Trivy image scan (OS packages)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cfgaudit:ci
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os
          ignore-unfixed: true
          exit-code: '1'
      # The image ships shellcheck for CFG045 (#716): a hook with an unquoted
      # expansion must come back as SC2086 when --shellcheck is set. Without
      # the binary, cfgaudit only warns and CFG045 reports nothing.
      - name: CFG045 runs inside the image
        run: |
          set -euo pipefail
          proj=$(mktemp -d)
          mkdir -p "$proj/.claude"
          # shellcheck disable=SC2016 # $FILE is the unquoted hook input CFG045 must report
          printf '%s\n' '{"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"rm $FILE"}]}]}}' \
            > "$proj/.claude/settings.json"
          chmod -R a+rX "$proj" # the image runs as uid 65532
          docker run --rm -v "$proj:/work:ro" -w /work cfgaudit:ci \
            --claude-version 2.1.0 --shellcheck --only CFG045 --format json . > cfg045.json
          jq -e 'any(.[]; .RuleID == "CFG045" and (.Message | contains("SC2086")))' cfg045.json > /dev/null
      # The Test job proves CFG045 against the pinned version, which only says
      # something about the image while the two agree (#1445).
      - name: The image ships the pinned ShellCheck
        run: |
          set -euo pipefail
          version=$(docker run --rm --entrypoint shellcheck cfgaudit:ci --version | sed -n 's/^version: //p')
          if [ "$version" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::The image ships ShellCheck ${version:-of no known version}, ci.yml pins $SHELLCHECK_VERSION. Update SHELLCHECK_VERSION and SHELLCHECK_SHA256."
            exit 1
          fi

  hadolint:
    name: Security (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lints the Dockerfile itself for issues neither Trivy (CVEs in the built
      # image) nor dockle (the image's runtime config) sees: unpinned base tags,
      # shell pitfalls, wasteful layers. Piped over stdin so hadolint needs no
      # access to the build context.
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint - < Dockerfile

  dockle:
    name: Security (dockle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t cfgaudit:ci .
      # CIS hardening checks on the built image — the non-root user (CIS-DI-0001)
      # and credentials leaked into layers. --exit-level warn gates on WARN and
      # above; the remaining INFO findings (Docker content trust, HEALTHCHECK) do
      # not apply to a short-lived, non-daemon CLI container.
      - name: Lint image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 --exit-code 1 --exit-level warn cfgaudit:ci

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Run this repository's composite action against the repo itself. `$/`
      # loads action.yml from the commit under test, not from the workspace,
      # so no earlier step can change which action runs (#693). The checkout
      # above is still needed: it is what the action scans and where it writes
      # the SARIF. Needs runner 2.336.0 or newer.
      # Pin to :latest, not the action's default image tag — that default points
      # at the next release, whose image isn't built until the tag is pushed.
      - id: scan
        uses: $/
        with:
          format: sarif
          output: cfgaudit.sarif
          fail-on: never
          image: ghcr.io/cfgaudit/cfgaudit:latest
      - name: Validate the action produced valid SARIF
        shell: bash
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          OUTPUT_FILE: ${{ steps.scan.outputs.output-file }}
        run: |
          test -f cfgaudit.sarif
          jq -e '.version == "2.1.0" and .runs[0].tool.driver.name == "cfgaudit"' cfgaudit.sarif > /dev/null
          echo "action exit-code=$EXIT_CODE, output-file=$OUTPUT_FILE"
      # A config outside the workspace replaces the scanned project's own
      # .cfgaudit.yml (#740): the fixture's file turns CFG004 off, the runner's
      # empty one does not, so CFG004 must be reported.
      - name: Fixture whose own .cfgaudit.yml silences CFG004
        shell: bash
        run: |
          mkdir -p config-fixture/.claude
          echo '{"permissions":{"defaultMode":"bypassPermissions"}}' > config-fixture/.claude/settings.json
          printf 'rules:\n  CFG004: off\n' > config-fixture/.cfgaudit.yml
          : > "$RUNNER_TEMP/cfgaudit.yml"
      - id: scan-config
        uses: $/
        with:
          path: config-fixture
          config: ${{ runner.temp }}/cfgaudit.yml
          format: json
          output: config-fixture.json
          fail-on: never
          image: ghcr.io/cfgaudit/cfgaudit:latest
      - name: The project's own config was not used
        shell: bash
        run: jq -e 'any(.[]; .RuleID == "CFG004")' config-fixture.json > /dev/null
      # Advisory mode ignores findings, not tool errors (#1061): a path that
      # does not exist makes cfgaudit exit 2, and the step must fail.
      - id: scan-error
        uses: $/
        continue-on-error: true
        with:
          path: does-not-exist
          format: sarif
          output: error.sarif
          fail-on: never
          image: ghcr.io/cfgaudit/cfgaudit:latest
      - name: Exit 2 failed the step despite fail-on never
        shell: bash
        env:
          OUTCOME: ${{ steps.scan-error.outcome }}
          EXIT_CODE: ${{ steps.scan-error.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE"
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 2

  # Every file has a copyright and license, from its own header or REUSE.toml,
  # and the license texts are in LICENSES/ (#789).
  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the reuse image
        # The image is pinned by digest in .github/tools/reuse/Dockerfile.
        run: docker build -q -t cfgaudit-reuse .github/tools/reuse
      - name: reuse lint
        # Run as the runner user, so git inside the container accepts the
        # checkout as safe and reuse skips the files .gitignore excludes.
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/data" cfgaudit-reuse lint

  # The repository's own agent config and the Claude Code plugin, which users
  # install from main, scanned by the released action (#813). Not the code of
  # the pull request: a change that weakens a rule must not pass its own check
  # with it. Dependabot moves the pin with each release.
  cfgaudit:
    name: Security (cfgaudit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An empty config written after checkout, so a .cfgaudit.yml in the pull
      # request cannot turn rules off. v1.17.1 resolves `config` inside the
      # workspace; rm -f drops a file or symlink the pull request put here.
      - run: rm -f .cfgaudit-ci.yml && touch .cfgaudit-ci.yml
      - name: Scan agent instructions, settings and the plugin package
        uses: cfgaudit/cfgaudit@bf8e9c02ee9d99e88c65b5a3241545e63c216312 # v1.19.0
        with:
          plugins: .
          config: .cfgaudit-ci.yml
          # No image override: the pinned action names its own release image, so
          # a Dependabot bump moves both together.

  zizmor:
    name: Security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        # Pinned: zizmor 1.27.0 logs a passed --gh-token in cleartext
        # (GHSA-f42p-wjw5-97qh), fixed in 1.28.0. This job passes GITHUB_TOKEN,
        # so an unpinned install could pull the leaking version and print the
        # token into the public Actions log.
        #
        # Installed by hash (#677), so a file replaced on PyPI under the same
        # version fails the install. --only-binary keeps pip on the wheel:
        # without it, a wheel that fails its hash makes pip fall back to building
        # the sdist instead of stopping.
        run: |
          pip install --only-binary :all: --require-hashes -r .github/tools/zizmor/requirements.txt
      - name: Run zizmor
        run: zizmor --gh-token "${{ secrets.GITHUB_TOKEN }}" .github/workflows/

name: Scorecard

# OpenSSF Scorecard (#675). Results go to code scanning, so a check that
# regresses shows up as an alert, and are published for the README badge.
#
# Publishing makes the Scorecard API check this workflow's shape and reject the
# results otherwise: no top-level or job-level env or defaults, no write
# permission at workflow level, id-token: write only on this job, an Ubuntu
# hosted runner, and only actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif, ossf/scorecard-action and
# step-security/harden-runner as steps. Keep it that way when editing.
#
# The action is SHA-pinned, but its action.yaml names its image by tag
# (ghcr.io/ossf/scorecard-action:v2.5.0), so the pin does not cover the image.
# The job holds no secret and no release permission.

on:
  push:
    branches: [main]
  schedule:
    - cron: "33 5 * * 1" # 05:33 UTC every Monday
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default GITHUB_TOKEN cannot read classic branch protection rules in
      # full, so Branch-Protection may score slightly differently from a local
      # run. An admin-scoped token just for that one check is not worth holding.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          sarif_file: results.sarif

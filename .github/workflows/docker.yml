name: Docker

on:
  push:
    tags:
      # Full semver tags only (vX.Y.Z) — not the moving vN GitHub Action tag.
      - 'v*.*.*'

# Default-deny at the workflow level; each job grants only what it needs, so the
# gate never holds signing rights it has no use for.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cfgaudit/cfgaudit

jobs:
  # A tag can point at any commit — including one whose CI failed, or one that
  # never reached main and so was never tested at all. Require a green CI run for
  # this exact SHA before anything is published. Fails closed: no completed run
  # means no push.
  gate:
    name: Require green CI
    runs-on: ubuntu-latest
    permissions:
      actions: read # read this repo's workflow-run history
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI conclusion for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Image publish blocked: CI for $SHA concluded '$conclusion', expected 'success'. If CI is still running for this commit, wait for it to finish and re-run this workflow; otherwise tag a commit whose CI passed on main."
            exit 1
          fi

  build-and-push:
    name: Build and push image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push the image to ghcr
      id-token: write # keyless signing via Sigstore (cosign + attestations)
      attestations: write # write provenance/SBOM attestations to the GitHub attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      # Everything below binds to the immutable digest, never a tag: a tag can be
      # repointed after the fact, so an attestation or signature attached to one
      # would not prove anything about the artifact a user actually pulls.

      # Provenance: proves this digest was built by this workflow from this repo
      # at this commit. Verify with:
      #   gh attestation verify oci://ghcr.io/cfgaudit/cfgaudit@<digest> -R cfgaudit/cfgaudit
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (Sigstore/Fulcio, identity = this workflow). Verify with:
      #   cosign verify ghcr.io/cfgaudit/cfgaudit@<digest> \
      #     --certificate-identity-regexp '^https://github.com/cfgaudit/cfgaudit/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign image
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      # upload-release-assets is off deliberately. The action defaults it to true
      # and then attaches the SBOM to the GitHub Release, which needs
      # contents: write — a permission this job has no other use for, and which
      # the workflow's default-deny stance exists to avoid handing out.
      #
      # It went unnoticed until v1.11.0 because the upload only happens when a
      # Release object already exists. Through v1.10.0 the Release workflow was
      # still running when this step fired, so the action skipped it silently;
      # at v1.11.0 the Release published seven seconds earlier and the step
      # failed, taking the SBOM attestation below down with it. The SBOM lives
      # on as an attestation bound to the digest, which is the durable form.
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

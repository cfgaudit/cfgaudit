rules:
  CFG003: off
  CFG004: warn
  CFG005: {severity: INFO}
  CFG006: {off: true}
  CFG007: {off: false, severity: error}
  CFG008:
min-severity: Warn
strict: true
no-exit-codes: false
exclude-paths: [vendor/]
content-paths: [README.md]
shellcheck: true
shellcheck-exclude: [SC2086, sc1090, 2034]
policy:
  require-deny: ["Bash(rm -rf *)"]
  forbid-allow: ["Bash(curl *)"]

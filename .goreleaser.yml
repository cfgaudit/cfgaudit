# GoReleaser configuration: cross-platform release binaries.
# Validate locally with `goreleaser check`; dry-run with `goreleaser release --snapshot --clean`.
version: 2

project_name: cfgaudit

before:
  hooks:
    - go mod download

builds:
  - id: cfgaudit
    main: ./cmd/cfgaudit
    binary: cfgaudit
    env:
      - CGO_ENABLED=0
    # A rebuild of the tag gives the same bytes: -trimpath drops the build
    # machine's paths (the build ID is then derived from the content), and the
    # binary's mtime is the commit time rather than the build time (#1103).
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Mirror the Dockerfile's ldflags so binaries report the same version string.
    ldflags:
      - -s -w -X main.cfgauditVersion={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cfgaudit
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Fixed metadata for every entry, so the archive does not carry the
    # checkout's file times or the build user (#1103).
    builds_info:
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
    files:
      - src: README.md
        info: &fileinfo
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0644
      - src: LICENSE
        info: *fileinfo
      - src: docs/rules/*.md
        dst: docs/rules
        strip_parent: true
        info: *fileinfo

checksum:
  name_template: checksums.txt

# One SBOM per release archive, generated by syft (installed in build-release.yml) and
# uploaded alongside the archives. Provenance for the same archives is attested
# in build-release.yml after this runs.
sboms:
  - artifacts: archive

# Release notes grouped by commit type: one line per squash-merged PR, without
# its SHA and without the feat:/fix: prefix the group heading already says (the
# title carries the issue and PR numbers). Dependency bumps and repo maintenance
# are left out (#721).
changelog:
  sort: asc
  format: '{{ trimprefix (trimprefix .Message "feat: ") "fix: " }}'
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - '^build\(deps\):'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 999

# The Homebrew tap is not written from here: cfgaudit/homebrew-tap pulls each
# release, checks its provenance and writes its formula itself (#1646).

release:
  prerelease: auto

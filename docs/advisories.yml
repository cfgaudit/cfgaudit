# Copyright the cfgaudit contributors
# SPDX-License-Identifier: Apache-2.0
#
# Known attacks behind cfgaudit's rules. This file is the source of the website's
# /advisories/ page, and cmd/cfgaudit/advisories_test.go checks it.
#
# An advisory is listed when it depends on something a repository file can carry.
# Server bugs and model behaviour without a configuration precondition are left
# out.
#
# Keys:
#   id        CVE, GHSA or campaign name. Entries are sorted by id, campaigns last.
#   aliases   other ids of the same advisory
#   repo      owner/name of the repository that publishes the GHSA, when it is
#             not in the GitHub Advisory Database
#   kind      cve (also for a GHSA) or campaign
#   agent     the affected product
#   fixed     the first fixed version, when there is one
#   summary   one short sentence for the website, with no working attack in it
#   coverage  full, partial or none
#   rules     rule and severity the fixture testdata/advisories/<id>.txtar must
#             produce; required unless coverage is none
#   related   rules whose docs cite the advisory but do not fire on its fixture
#   reason    why cfgaudit does not see everything; required unless coverage is full
#               not-static   needs run-time state a file scan cannot see
#               no-rule-yet  visible in a file, no rule yet; needs issue
#               by-design    deliberately not reported; needs note
#   issue     tracking issue for no-rule-yet
#   note      one sentence on what is missing; required for not-static and by-design
#   steps     for a campaign: each step with the rules that see it, or a reason


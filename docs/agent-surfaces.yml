#
# The project files cfgaudit claims to read, per agent (#1443). It is the first
# half of the check that cfgaudit's model of an agent still matches the agent:
# cmd/cfgaudit/surfaces_test.go writes each file into an empty directory and
# requires `cfgaudit inventory` to list it under the agent named here, and it
# fails on an agent prefix of the inventory that no line covers.
#
# A path with a name in it, such as .claude/skills/a/SKILL.md, stands for the
# whole family.
#
# Lines with `scope: user` are the user-global files `--user` reads, with the
# path relative to the home directory. The test writes them into a temporary
# home. Plugin packages under ~/.claude/plugins and ~/.claude/skills stay out,
# like .claude-plugin/ in a project: they are read as packages.
#
# Managed files are not listed, because cfgaudit reads none. They sit outside
# the repository and the home directory, under paths such as /etc, and an
# administrator controls them, not a repository. A rule that needs one can only
# state what it assumes.
#
# Keys:
#   agent    the name `cfgaudit inventory` prints
#   kind     what the file configures, one word
#   path     the file, relative to the repository root
#   scope    user for a user-global file; project when absent
#   content  a minimal file that yields a target; plain text when absent.
#            Inert: nothing here is executed, the scan only reads it.


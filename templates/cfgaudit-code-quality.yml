# cfgaudit GitLab CI/CD component — surface findings inline in merge requests
# via a GitLab Code Quality (Code Climate) report.
#
#   include:
#     - component: gitlab.com/cfgaudit/cfgaudit/cfgaudit-code-quality@v1.18.0
#       inputs:
#         path: .
#
# The report is uploaded as artifacts:reports:codequality, so findings appear in
# the MR's Code Quality widget. Advisory by default (allow_failure: true) — the
# widget surfaces findings without blocking the pipeline.
spec:
  inputs:
    stage:
      default: test
      description: Pipeline stage the job runs in.
    path:
      default: "."
      description: Directory to scan.
      # Interpolated into the script inside double quotes (#798): path
      # characters and $VAR or ${VAR} references only, no quotes, backticks or
      # $( ).
      regex: '^([A-Za-z0-9 ._/@+-]|\$[A-Za-z_][A-Za-z0-9_]*|\$\{[A-Za-z_][A-Za-z0-9_]*\})*$'
    config:
      default: ""
      description: >-
        .cfgaudit.yml to use instead of the one in the scanned directory. For merge
        requests from people you do not fully trust, point it at a file the merge
        request cannot change, such as a File-type CI/CD variable ($CFGAUDIT_CONFIG).
      # Interpolated into the script inside double quotes (#798): path
      # characters and $VAR or ${VAR} references only, no quotes, backticks or
      # $( ).
      regex: '^([A-Za-z0-9 ._/@+-]|\$[A-Za-z_][A-Za-z0-9_]*|\$\{[A-Za-z_][A-Za-z0-9_]*\})*$'
    version:
      default: "1.18.0"
      description: >-
        cfgaudit ghcr.io image tag (pinned; do not use a moving tag), optionally
        with its digest: X.Y.Z@sha256:<digest>.
      regex: '^[0-9]+\.[0-9]+\.[0-9]+(@sha256:[0-9a-f]{64})?$'
    allow_failure:
      type: boolean
      default: true
      description: When true (default), findings surface in the MR widget without blocking.
---
cfgaudit-code-quality:
  stage: $[[ inputs.stage ]]
  image:
    name: "ghcr.io/cfgaudit/cfgaudit:$[[ inputs.version ]]"
    entrypoint: [""]
  script:
    - set -- ; if [ -n "$[[ inputs.config ]]" ]; then set -- --config "$[[ inputs.config ]]"; fi
    - cfgaudit --format codeclimate "$@" "$[[ inputs.path ]]" > gl-code-quality-report.json; rc=$?; exit $rc
  allow_failure: $[[ inputs.allow_failure ]]
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    when: always
    # Long enough to cover a merge request review (#798).
    expire_in: 30 days
